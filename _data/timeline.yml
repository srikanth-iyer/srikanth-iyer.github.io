  year: 2006
  when: 2006 to 2009 · Mumbai
  title: Mass media and journalism
  text: >-
    A bachelor's in mass media at the University of Mumbai, and my first paid
    writing, as a sports writer.

- id: j-2008
  year: 2008
  when: 2008 to 2022 · Mumbai
  title: Fifteen years of stories
  text: >-
    I produced commercials and ran their post-production, wrote and directed for
    brands, consulted on branding, and then wrote stories and screenplays,
    including co-writing *Capgras*, a psychological horror film rooted in folklore.

- id: j-2023
  year: 2023
  when: 2023 · Binghamton, New York
  title: A turn to science
  text: >-
    A master's in Systems Science at Binghamton University, then research in the
    CASCI lab with Luis M. Rocha on how simple parts decide things together.

- id: j-2025
  year: 2025
  when: 2025 · Binghamton
  title: PhD in Systems Science
  text: >-
    Which rules let a crowd of simple things reach the right answer when the world
    is noisy, and what happens when the crowd is made of AI agents.

