  - id: positions
    heading: Research positions
    menu: Research
    entries:
      - title: Research Fellow
        when: Apr 2026 – present
        where: >-
          CBeRa (ERA Chair), Católica Biomedical Research Centre · Católica Medical School,
          Universidade Católica Portuguesa · Oeiras, Lisbon, Portugal
        bullets:
          - >-
            Studying network models of gene regulation, disease co-occurrence (comorbidity),
            epidemic spread and the brain, and how built-in logical redundancy shapes their
            system dynamics.
          - >-
            Developing open-source Python tooling to analyze and visualize graphs, aimed at
            explainability of the dynamic evolution and control of systems biology models.
          - >-
            Building multiscale biochemical network models and their data pipelines toward
            the project's goal of biomedical digital twins.
        note: >-
          Supervisor: Prof. Luis M. Rocha (PI, ERA Chair Holder) · Funded by Horizon Europe
          ERA Chair (grant 101186558)
        links:
          - label: cberaproject.eu
            url: https://www.cberaproject.eu
          - label: linkedin.com/company/cbera-project
            url: https://www.linkedin.com/company/cbera-project/
      - title: Research Collaborator
        when: Aug 2025 – present
        where: >-
          Collaborative Decisions group (Dr. Neha Patankar) · Binghamton University, State
          University of New York · Binghamton, NY, USA
        bullets:
          - >-
            Analyzing town and county moratoria on large solar, wind and battery projects
            across New York State, so that GenX, a capacity-expansion model that finds the
            lowest-cost mix of power plants, storage and transmission lines, can account for
            them.
          - >-
            Modeling why and when towns adopt a moratorium, and whether one town's decision
            spreads to its neighbors, with statistical models that isolate the main factors
            behind local decisions; a neighboring town's adoption raises a town's monthly
            odds of adopting by about 11%.
          - >-
            Forecasting future moratoria with Monte Carlo simulation: running the fitted model
            forward month by month many times, then testing the forecasts against what happened
            later (out-of-time backtest).
          - >-
            Working with PowerGenome, an open-source tool that turns public power-system data
            into planning scenarios, to build New York scenarios for GenX, and optimizing
            them with Gurobi, a commercial mathematical-optimization solver, including runs
            that produce a range of near-lowest-cost alternatives (modeling to generate alternatives).
          - >-
            Built a GenX scenario export pipeline and an interactive results dashboard (Quarto,
            Shinylive) that compare New York scenarios: capacity built, power-plant dispatch,
            emissions and capacity factors.
        tags:
          - Python
          - GeoPandas
          - statsmodels
          - SQLite
          - GenX (Julia)
          - PowerGenome
          - Quarto
        links:
          - label: Dr. Neha Patankar, SSIE faculty profile
            url: https://www.binghamton.edu/ssie/people/profile.html?id=npatankar
      - title: Graduate Research Assistant
        when: May 2024 – present
        where: >-
          Complex Adaptive Systems and Computational Intelligence Lab (CASCI) · Binghamton
          University, State University of New York · Binghamton, NY, USA
        bullets:
          - >-
            Showed that when simple decision rules evolve to reach a group decision despite
            random errors, evolution favors rules with more logical redundancy (rules that
            rely on only some of their inputs), using large-scale GPU simulation of a collective
            behavior model.
          - >-
            Extended CANA, an open-source library that measures redundancy, symmetry and control
            in on/off (Boolean) network models, and added new symmetry calculations to the
            main library.
          - >-
            Developed Balanced Robustness, a single score for how well a decision rule holds
            up under random errors, and used it to show that redundancy and symmetry are the
            design features behind reliable rules.
          - >-
            Testing whether evolution selects for symmetry in a rule's logic as a design principle.
        note: >-
          Supervisor: Prof. Luis M. Rocha · Funded by an SSIE Graduate Assistantship with
          tuition scholarship, awarded on academic merit (Fall 2024 - Spring 2026)
        links:
          - label: casci.binghamton.edu
            url: https://casci.binghamton.edu/

