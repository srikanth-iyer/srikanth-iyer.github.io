# The CV page (/cv/). Edit the words here; the page itself is cv/index.html.
# This file is kept by hand. It is NOT copied from your private CV repo, so you can
# word and merge things for the web. When you add a talk to your private CV, add it here too.
#
# Rule 1: never a phone number. Rule 2: nothing private, so no unfinished papers
# and nothing marked tentative or submitted. The checks stop a commit that breaks these.
#
# Each section has:
#   id:       short name used in the page address (/cv/#talks); keep it unique
#   heading:  the title shown on the page
#   menu:     optional shorter name for the side menu
#   compact:  optional; true packs the entries closer together
#   intro:    optional sentence under the heading
#   feature:  optional video at the top: youtube (the id after watch?v=), title, caption
#   entries:  the items, each with any of these fields:
#     title, url (makes the title a link), when, where,
#     bullets (a list), note (one line), meta (one small grey line),
#     tags (a list of short words), links and watch (lists of label + url)
#   pairs:    instead of entries, label + text rows (used for Skills)
#
# Markdown works in the text: *italics*, **bold**, [a link](https://...).

