# The full checks, but only for branches whose names start with claude/.
# Those commits are made by Claude in the cloud, so your laptop's pre-push check never sees them.
# Screenshots of every page (phone and laptop, light and dark) are attached to each run.
name: Full check of cloud commits

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    # Ubuntu 24.04: the newest system the browser test tool (Playwright) supports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full checks
        run: python tests/run_tests.py full
        env:
          PHONE_TO_BLOCK: ${{ secrets.PHONE_TO_BLOCK }}
      - name: Keep the screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-report
          path: test-results/
          retention-days: 14
